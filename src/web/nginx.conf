server {
    listen 80;
    # Allow any request hostname or IP address
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Fall back to index.html for Blazor client-side routing
        try_files $uri $uri/ /index.html;
    }

    # Enable correct MIME types for WebAssembly
    types {
        text/html html htm;
        application/wasm wasm;
        application/javascript js;
        text/css css;
        application/json json;
    }
}